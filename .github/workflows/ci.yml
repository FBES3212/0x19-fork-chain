# 0x19 impact proof: uses only the workflow-provided github.token; no repository secrets
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  pr-noop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "0x19 impact PR context noop"
  impact:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: create-proof-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/heads/0x19-impact-proof -f sha=${{ github.sha }}
          echo "0x19-impact-proof-created"
